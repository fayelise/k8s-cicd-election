apiVersion: v1
kind: ServiceAccount
metadata:
  name: cicd-orchestrator
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cicd-orchestrator-role
  namespace: default
rules:
  # Nécessaire pour créer/lire/mettre à jour le Lease utilisé par l'élection
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  # Nécessaire pour mettre à jour l'image du Deployment de l'application de démo
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cicd-orchestrator-binding
  namespace: default
subjects:
  - kind: ServiceAccount
    name: cicd-orchestrator
    namespace: default
roleRef:
  kind: Role
  name: cicd-orchestrator-role
  apiGroup: rbac.authorization.k8s.io
