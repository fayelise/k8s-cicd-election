name: CI - orchestrator (build, publish)

# on:
#   push:
#     branches: [main]
#     paths:
#       - "orchestrator/**"
#       - ".github/workflows/ci-orchestrator.yml"

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "orchestrator/**"
      - ".github/workflows/ci-orchestrator.yml"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/orchestrator

jobs:
  build-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Connexion à GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build et publication de l'image
        uses: docker/build-push-action@v5
        with:
          context: orchestrator
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
