name: CI/CD - demo-api (build, test, publish)

# on:
#   push:
#     branches: [main]
#     paths:
#       - "demo-api/**"
#       - ".github/workflows/ci-demo-api.yml"

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "demo-api/**"
      - ".github/workflows/ci-demo-api.yml"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/demo-api

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        working-directory: demo-api
        run: pip install -r requirements.txt

      - name: Lancer les tests
        working-directory: demo-api
        run: pytest -v

      - name: Connexion à GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build et publication de l'image
        uses: docker/build-push-action@v5
        with:
          context: demo-api
          push: true
          build-args: |
            APP_VERSION=${{ github.sha }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
